name: Secret scan

# v0.35.0+: runs gitleaks on every push + PR to detect leaked
# secrets BEFORE they make it past CI. Pairs with GitHub's
# native Secret Scanning + Push Protection (configured in repo
# Settings) for defence in depth.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with full history for diff scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # gitleaks reads .gitleaksignore at the repo root for
          # allow-listed paths (e.g. .env.example).
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
