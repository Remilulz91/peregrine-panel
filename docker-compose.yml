# Peregrine - run the panel with:  docker compose up -d
# Before the first launch: cp .env.example .env  (then edit .env)

services:
  peregrine:
    build: .
    container_name: peregrine
    restart: unless-stopped
    # v0.34.0+: hardening. Apply minimum-privilege defaults so a panel
    # RCE has fewer LOLBin / privesc paths. `read_only` keeps the
    # filesystem immutable except mounted volumes + tmpfs. Drop all
    # caps and re-add only CHOWN/SETUID/SETGID (needed for the SFTP
    # 1000:1000 chown) and DAC_OVERRIDE (needed to manage /data perms).
    security_opt:
      - "no-new-privileges:true"
    read_only: true
    tmpfs:
      - /tmp:size=50m,mode=1777
      - /run:size=10m
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETUID
      - SETGID
      - DAC_OVERRIDE
      - FOWNER
    pids_limit: 1024
    ulimits:
      nproc: 1024
      nofile: 4096
    ports:
      - "${PEREGRINE_BIND:-127.0.0.1}:${HOST_PORT:-3000}:3000"
      # SFTP — exposed on every interface so users can connect from
      # outside the host. Change the binding via PEREGRINE_SFTP_BIND
      # (e.g. set it to 127.0.0.1 to keep SFTP local-only).
      - "${PEREGRINE_SFTP_BIND:-0.0.0.0}:${SFTP_PORT:-2022}:2022"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # v0.22.4+: timezone used by the schedule worker. Set TZ in your
      # .env (e.g. TZ=Europe/Paris) so 04:00 means 04:00 local time
      # instead of 04:00 UTC. Default UTC when .env doesn't set it.
      - TZ=${TZ:-UTC}
    volumes:
      # Persistent panel data (the SQLite database).
      - peregrine-data:/data
      # Lets Peregrine create and manage the game-server containers.
      # This grants the panel full control of Docker on this host.
      - /var/run/docker.sock:/var/run/docker.sock
      # Game-server files. The path MUST be identical inside and outside
      # the container, so that bind mounts for the game containers resolve
      # correctly on the Docker host.
      - "${SERVERS_PATH:-/srv/peregrine/servers}:${SERVERS_PATH:-/srv/peregrine/servers}"
      # Backup archives (.tar.gz). Lives on the same dedicated disk as
      # the servers by default, so a single mount holds both.
      - "${BACKUPS_PATH:-/srv/peregrine/backups}:${BACKUPS_PATH:-/srv/peregrine/backups}"

volumes:
  peregrine-data:
